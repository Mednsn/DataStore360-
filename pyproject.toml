[project]
name = "datastore360-first-brief"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohamed", email = "medolgholb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-postgres>=7.0.2",
    "matplotlib<=3.10",
    "numpy>=1.22,<2.4",
    "pandas>=2.0,<3",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "seaborn<0.13",
    "sqlalchemy>=2.0.52",
    "ydata-profiling>=4.18.4",
    "setuptools<81",
]

[project.scripts]
datastore360-first-brief = "datastore360_first_brief:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
